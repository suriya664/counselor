<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Counselor</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
</head>

<body class="page-login">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <button class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
    <span class="theme-icon">🌙</span>
  </button>

  <main id="main-content" class="section">
    <div class="container">
      <div style="text-align: center; margin-bottom: 24px;">
        <a class="brand" href="index.html"><span class="logo-mark">C</span> Counselor</a>
      </div>
      <h2>Login</h2>
      <p class="lead">Access your counselor dashboard and continue your progress plan.</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="name@company.com" required />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" required />

        <div class="auth-form-footer">
          <div class="checkbox-row">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe" style="margin-bottom: 0; font-weight: 500; font-size: 0.8rem;">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <div class="social-auth">
          <p>Or continue with</p>
          <div class="social-btns">
            <button type="button" class="social-btn">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853" />
                <path
                  d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"
                  fill="#FBBC05" />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335" />
              </svg>
              Google
            </button>
            <button type="button" class="social-btn">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0077b5">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
              </svg>
              LinkedIn
            </button>
          </div>
        </div>

        <p id="loginMsg" class="msg"></p>
        <p class="meta" style="text-align: center; margin-top: 24px;">
          New here? <a href="register.html"
            style="color: var(--primary); font-weight: 600; text-decoration: none;">Create an account</a>
        </p>
      </form>

    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
